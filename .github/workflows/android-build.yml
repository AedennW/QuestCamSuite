name: Android CI & APK Builder

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate & build APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components (platform 34, build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Regenerate Gradle wrapper (jar is gitignored-safe to add locally)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Lint (report only)
        run: gradle --no-daemon lintDebug || true

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Compile release APK (unsigned without signing secrets)
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Sign release APK (only when signing secrets are configured)
        if: ${{ vars.QUEST_SIGNING_ENABLED == 'true' }}
        env:
          QUEST_KEYSTORE_PASSWORD: ${{ secrets.QUEST_KEYSTORE_PASSWORD }}
          QUEST_KEY_ALIAS: ${{ secrets.QUEST_KEY_ALIAS }}
          QUEST_KEY_PASSWORD: ${{ secrets.QUEST_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.QUEST_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/quest.keystore"
          export QUEST_KEYSTORE="$RUNNER_TEMP/quest.keystore"
          gradle --no-daemon --stacktrace clean assembleRelease

      - name: Verify APK artifacts
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q "AndroidManifest.xml"
          echo "── package info ──"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | head -n 6
          echo "── permissions ──"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk
          echo "── signature ──"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk || true

      - name: Stage distributable APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MetaQuestCamera-debug.apk
          RELEASE_APK=$(ls app/build/outputs/apk/release/app-release.apk 2>/dev/null \
            || ls app/build/outputs/apk/release/app-release-unsigned.apk)
          NAME=MetaQuestCamera-release-unsigned.apk
          if [[ "$RELEASE_APK" == *"app-release.apk" ]]; then NAME=MetaQuestCamera.apk; fi
          cp "$RELEASE_APK" "dist/$NAME"
          ls -lh dist/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MetaQuestCamera-apks
          path: dist/*.apk
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: MetaQuestCamera-apks
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            ## Quest Camera Suite — ${{ github.ref_name }}

            **Install:** enable Developer Mode on the headset, then
            `adb install -r MetaQuestCamera-debug.apk` (or transfer the release APK).
            Grant **Camera** and **Headset Camera** when prompted, and enable passthrough.

            ### Verified pipeline
            - Kotlin compile + unit tests + lint report
            - APK structure / manifest / permissions / signature verified in CI
            - On-headset behaviour must still be validated on physical hardware

            ### Includes
            - Camera2 passthrough capture (Horizon OS v76+, Quest 3 / 3S)
            - Photo studio: single, burst, timer, interval · JPEG/PNG
            - Video studio: H.264/HEVC presets, pause/resume, auto-split
            - Destination chooser: internal + SAF/USB-OTG trees with persisted grants
            - Gallery, LAN share server, diagnostics probe, per-HAL honest capability gating

            See FEATURES.md in the repository for the implemented / experimental /
            platform-blocked matrix before flashing.
